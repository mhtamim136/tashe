<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TaShe Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar glass">
      <button class="icon-button mobile-only" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
      <div class="brand">
        <div class="brand-mark">T</div>
        <div><h1>TaShe Cloud</h1><p>Personal Cloud Storage</p></div>
      </div>
      <div class="top-actions">
        <button class="pill secure" id="secureButton">🔒 Secure</button>
        <button class="pill" id="themeButton">🌙</button>
      </div>
    </header>

    <aside class="sidebar glass" id="sidebar">
      <button class="nav-item active" data-root>🏠 Home</button>
      <button class="nav-item" id="uploadShortcut">⬆️ Upload</button>
      <button class="nav-item" id="newFolderShortcut">📁 New folder</button>
      <div class="storage-card"><strong>Google Drive backend</strong><span>No credentials exposed. All operations use Apps Script.</span></div>
    </aside>

    <main class="content">
      <section class="toolbar glass">
        <nav class="breadcrumb" id="breadcrumb"></nav>
        <div class="tools">
          <input id="searchInput" class="search" placeholder="Search files and folders…">
          <select id="sortSelect"><option value="name">Name</option><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="size">Size</option><option value="type">Type</option></select>
          <button class="icon-button" id="viewButton">▦</button>
        </div>
      </section>

      <section class="dropzone glass" id="dropzone">
        <div><strong>Drop files to upload</strong><span>Multiple files supported through Apps Script</span></div>
        <button class="primary" id="uploadButton">Choose files</button>
        <input type="file" id="fileInput" multiple hidden>
      </section>

      <section class="progress-panel" id="progressPanel" hidden></section>
      <section class="file-area grid" id="fileArea" aria-live="polite"></section>
    </main>

    <footer>Developed by <a href="https://mhtamim136.github.io" target="_blank" rel="noopener">Murad Hasan Tamim</a></footer>
  </div>

  <div class="modal-backdrop" id="modal" hidden><div class="modal glass"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modalActions" id="modalActions"></div></div></div>
  <div class="context-menu glass" id="contextMenu" hidden></div>

  <script src="config.js"></script>
  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="script.js"></script>
</body>
</html>
